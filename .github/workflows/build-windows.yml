name: Build Windows Installer

on:
  push:
    branches:
      - main
      - release/**
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate Windows icon
        run: |
          python -c "from PIL import Image; img = Image.open('src-tauri/icons/icon.png'); img.save('src-tauri/icons/icon.ico', format='ICO', sizes=[(256,256), (128,128), (64,64), (48,48), (32,32), (16,16)])"
          if (Test-Path "src-tauri\icons\icon.ico") {
            Write-Host "icon.ico created successfully"
          } else {
            Write-Host "Error: Failed to create icon.ico"
            exit 1
          }

      - name: Download FFmpeg for Windows
        run: |
          echo "Downloading FFmpeg for Windows..."
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $tempDir = "$env:TEMP\ffmpeg-download"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile "$tempDir\ffmpeg.zip" -UseBasicParsing
          Expand-Archive -Path "$tempDir\ffmpeg.zip" -DestinationPath "$tempDir" -Force
          $ffmpegExe = Get-ChildItem -Path $tempDir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path $tempDir -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if ($ffmpegExe -and $ffprobeExe) {
            New-Item -ItemType Directory -Force -Path "src-tauri\resources" | Out-Null
            Copy-Item $ffmpegExe.FullName -Destination "src-tauri\resources\ffmpeg.exe" -Force
            Copy-Item $ffprobeExe.FullName -Destination "src-tauri\resources\ffprobe.exe" -Force
            echo "FFmpeg downloaded successfully"
            echo "FFmpeg path: src-tauri\resources\ffmpeg.exe"
            echo "FFprobe path: src-tauri\resources\ffprobe.exe"
          } else {
            echo "Error: Could not find ffmpeg.exe or ffprobe.exe in downloaded archive"
            exit 1
          }

      - name: Build Windows installer
        run: npm run tauri:build:windows
        env:
          CARGO_TERM_COLOR: always

      - name: List build artifacts
        run: |
          echo "MSI files:"
          dir /s /b src-tauri\target\release\bundle\msi\*.msi 2>nul || echo "No MSI files found"
          echo "NSIS files:"
          dir /s /b src-tauri\target\release\bundle\nsis\*.exe 2>nul || echo "No NSIS files found"

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-installer-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30
          if-no-files-found: warn

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-installer-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: warn

