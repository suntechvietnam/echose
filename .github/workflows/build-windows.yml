name: Build Windows Installer

on:
  push:
    branches:
      - main
      - release/**
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Prepare resources directory
        run: |
          Write-Host "Ensuring resources directory exists..."
          $resourcesDir = "src-tauri\resources"
          if (-not (Test-Path $resourcesDir)) {
            New-Item -ItemType Directory -Force -Path $resourcesDir | Out-Null
            Write-Host "Created resources directory: $resourcesDir"
          } else {
            Write-Host "Resources directory already exists: $resourcesDir"
          }
          
          # Add a placeholder file to ensure directory is not empty
          $placeholderFile = "$resourcesDir\.gitkeep"
          if (-not (Test-Path $placeholderFile)) {
            New-Item -ItemType File -Path $placeholderFile -Force | Out-Null
            Write-Host "Created placeholder file: $placeholderFile"
          }

      - name: Verify Windows icon exists
        run: |
          if (Test-Path "src-tauri\icons\icon.ico") {
            $fileInfo = Get-Item "src-tauri\icons\icon.ico"
            Write-Host "✓ icon.ico found: $($fileInfo.FullName)"
            Write-Host "  Size: $($fileInfo.Length) bytes"
          } else {
            Write-Host "Error: icon.ico not found. Please add icon.ico to src-tauri/icons/"
            Write-Host "You can generate it using: python scripts/generate_icon.py"
            exit 1
          }

      - name: Download FFmpeg for Windows
        run: |
          echo "Downloading FFmpeg for Windows..."
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $tempDir = "$env:TEMP\ffmpeg-download"
          New-Item -ItemType Directory -Force -Path $tempDir | Out-Null
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile "$tempDir\ffmpeg.zip" -UseBasicParsing
          Expand-Archive -Path "$tempDir\ffmpeg.zip" -DestinationPath "$tempDir" -Force
          $ffmpegExe = Get-ChildItem -Path $tempDir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path $tempDir -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if ($ffmpegExe -and $ffprobeExe) {
            New-Item -ItemType Directory -Force -Path "src-tauri\resources" | Out-Null
            Copy-Item $ffmpegExe.FullName -Destination "src-tauri\resources\ffmpeg.exe" -Force
            Copy-Item $ffprobeExe.FullName -Destination "src-tauri\resources\ffprobe.exe" -Force
            echo "FFmpeg downloaded successfully"
            echo "FFmpeg path: src-tauri\resources\ffmpeg.exe" 
            echo "FFprobe path: src-tauri\resources\ffprobe.exe"
            
            # FFmpeg will be manually copied to bundle after build completes
            Write-Host "FFmpeg downloaded and ready for manual bundle inclusion"
          } else {
            echo "Error: Could not find ffmpeg.exe or ffprobe.exe in downloaded archive"
            exit 1
          }

      - name: Install build tools (NSIS and WiX)
        run: |
          Write-Host "Checking for Chocolatey..."
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            Write-Host "Chocolatey not found, installing..."
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          }
          
          Write-Host "Installing NSIS and WiX Toolset..."
          # Install NSIS for NSIS installer
          choco install nsis -y --no-progress
          # Install WiX Toolset v3 for MSI installer (specific version)
          choco install wixtoolset --version=3.11.2 -y --no-progress --force
          
          # Refresh environment variables
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          
          # Add NSIS and WiX to PATH explicitly with multiple location checks
          $nsisBin = "C:\Program Files (x86)\NSIS"
          $wixBins = @(
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files\WiX Toolset v3.11\bin",
            "C:\tools\WiX\bin"
          )
          
          if (Test-Path $nsisBin) {
            $env:Path += ";$nsisBin"
            Write-Host "Added NSIS to PATH: $nsisBin"
          }
          
          $wixFound = $false
          foreach ($wixBin in $wixBins) {
            if (Test-Path $wixBin) {
              $env:Path += ";$wixBin"
              Write-Host "Added WiX to PATH: $wixBin"
              $wixFound = $true
              break
            }
          }
          
          if (-not $wixFound) {
            Write-Host "WiX not found at expected locations, searching..."
            $wixSearch = Get-ChildItem -Path "C:\Program Files*" -Filter "candle.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($wixSearch) {
              $wixDir = $wixSearch.DirectoryName
              $env:Path += ";$wixDir"
              Write-Host "Found and added WiX to PATH: $wixDir"
            }
          }
          
          Write-Host "Build tools installed"
          Write-Host "Updated PATH includes:"
          $env:Path -split ';' | Where-Object { $_ -like "*NSIS*" -or $_ -like "*WiX*" } | ForEach-Object { Write-Host "  $_" }
          
          # Verify installations
          Write-Host "`nChecking NSIS..."
          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $nsisPath) {
            Write-Host "✓ NSIS found at $nsisPath"
            & $nsisPath /VERSION 2>&1 | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "✗ NSIS not found at expected location"
            # Try to find NSIS
            $foundNsis = Get-ChildItem -Path "C:\Program Files*" -Filter "makensis.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundNsis) {
              Write-Host "  Found NSIS at: $($foundNsis.FullName)"
              $env:Path += ";$($foundNsis.DirectoryName)"
            }
          }
          
          Write-Host "`nChecking WiX..."
          $wixPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.11\bin\candle.exe",
            "C:\Program Files\WiX Toolset v3.11\bin\candle.exe"
          )
          $wixFound = $false
          foreach ($wixPath in $wixPaths) {
            if (Test-Path $wixPath) {
              Write-Host "✓ WiX found at $wixPath"
              $wixFound = $true
              $env:Path += ";$(Split-Path $wixPath)"
              break
            }
          }
          if (-not $wixFound) {
            Write-Host "✗ WiX not found at expected locations"
            # Try to find WiX
            $foundWix = Get-ChildItem -Path "C:\Program Files*" -Filter "candle.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundWix) {
              Write-Host "  Found WiX at: $($foundWix.FullName)"
              $env:Path += ";$($foundWix.DirectoryName)"
            }
          }

      - name: Verify Build Tools and Environment
        run: |
          Write-Host "=== Build Tools Verification ==="
          
          # Check PATH for build tools
          Write-Host "Checking PATH for build tools:"
          $pathEntries = $env:PATH -split ';' | Where-Object { $_ -match '(nsis|wix|cargo|rust)' -and $_ -ne '' }
          if ($pathEntries) {
            $pathEntries | ForEach-Object { Write-Host "  $_" }
          } else {
            Write-Host "  No relevant build tool paths found in PATH"
          }
          
          # Force add build tools to PATH
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (Test-Path $nsisPath) {
            $env:PATH += ";$nsisPath"
            Write-Host "Added NSIS to PATH: $nsisPath"
          }
          
          # Search for WiX in multiple possible locations
          $wixPaths = @(
            "C:\Program Files (x86)\WiX Toolset v3.11\bin",
            "C:\Program Files\WiX Toolset v3.11\bin",
            "C:\Program Files (x86)\Microsoft SDKs\Windows\WiX\v3.11\bin",
            "C:\tools\WiX\bin"
          )
          
          $wixFound = $false
          foreach ($wixPath in $wixPaths) {
            if (Test-Path $wixPath) {
              $env:PATH += ";$wixPath"
              Write-Host "Added WiX to PATH: $wixPath"
              $wixFound = $true
              break
            }
          }
          
          # If not found in expected locations, search system-wide
          if (-not $wixFound) {
            Write-Host "Searching for WiX system-wide..."
            $foundWix = Get-ChildItem -Path "C:\" -Filter "candle.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundWix) {
              $wixPath = $foundWix.DirectoryName
              $env:PATH += ";$wixPath"
              Write-Host "Found and added WiX to PATH: $wixPath"
              $wixFound = $true
            }
          }
          
          # Verify tools are accessible
          Write-Host "`nTesting tool accessibility:"
          try {
            $nsisOutput = & makensis.exe /VERSION 2>&1
            Write-Host "✓ NSIS: $nsisOutput"
          } catch {
            Write-Host "✗ NSIS makensis not accessible: $_"
          }
          
          try {
            $candleOutput = & candle.exe --help 2>&1 | Select-Object -First 1
            Write-Host "✓ WiX candle.exe: Accessible"
          } catch {
            Write-Host "✗ WiX candle.exe not accessible: $_"
            Write-Host "Attempting to download WiX directly..."
            
            # Download WiX directly if chocolatey install failed
            try {
              $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip"
              $wixDir = "C:\tools\WiX"
              New-Item -ItemType Directory -Force -Path $wixDir | Out-Null
              Invoke-WebRequest -Uri $wixUrl -OutFile "$wixDir\wix.zip"
              Expand-Archive -Path "$wixDir\wix.zip" -DestinationPath $wixDir -Force
              $env:Path += ";$wixDir"
              Write-Host "✓ WiX downloaded and added to PATH: $wixDir"
            } catch {
              Write-Host "✗ Failed to download WiX: $_"
            }
          }

      - name: Debug Tauri Configuration
        run: |
          Write-Host "=== Tauri CLI Debug Information ==="
          
          # Check Tauri CLI version
          Write-Host "Tauri CLI version:"
          npx tauri --version
          
          # Check if tauri.conf.json is valid
          Write-Host "`nTauri configuration check:"
          if (Test-Path "src-tauri\tauri.conf.json") {
            Write-Host "✓ tauri.conf.json exists"
            try {
              $config = Get-Content "src-tauri\tauri.conf.json" | ConvertFrom-Json
              Write-Host "✓ tauri.conf.json is valid JSON"
              
              if ($config.tauri.bundle) {
                Write-Host "Bundle configuration found:"
                Write-Host "  Active: $($config.tauri.bundle.active)"
                Write-Host "  Targets: $($config.tauri.bundle.targets -join ', ')"
                Write-Host "  Identifier: $($config.tauri.bundle.identifier)"
              } else {
                Write-Host "✗ No bundle configuration found!"
              }
            } catch {
              Write-Host "✗ tauri.conf.json is invalid: $_"
            }
          } else {
            Write-Host "✗ tauri.conf.json not found!"
          }
          
          # Test the build command manually first
          Write-Host "`nTesting build command components:"
          Write-Host "Command that will be executed:"
          npm run tauri:build:windows --dry-run 2>&1 | Write-Host

      - name: Build Windows installer
        id: build
        run: |
          Write-Host "Building Windows installer..."
          Write-Host "Command: npm run tauri:build:windows"
          
          # Run build and capture output
          $buildOutput = npm run tauri:build:windows 2>&1 | Tee-Object -Variable fullOutput
          $buildExitCode = $LASTEXITCODE
          
          Write-Host "`n=== Build Output ==="
          $fullOutput
          Write-Host "`n=== Build Exit Code: $buildExitCode ==="
          
          # Check if executable was created
          Write-Host "`n=== Checking for executable ==="
          $exeFiles = Get-ChildItem -Path "src-tauri\target\release" -Filter "*.exe" -ErrorAction SilentlyContinue
          if ($exeFiles) {
            Write-Host "✓ Executable found:"
            $exeFiles | ForEach-Object { Write-Host "  $($_.FullName)" }
          } else {
            Write-Host "✗ No executable found in release directory"
          }
          
          # Check if bundle directory was created
          Write-Host "`n=== Checking bundle directory ==="
          $bundleDir = "src-tauri\target\release\bundle"
          if (Test-Path $bundleDir) {
            Write-Host "✓ Bundle directory exists: $bundleDir"
            Write-Host "Contents:"
            Get-ChildItem -Path $bundleDir -Recurse | ForEach-Object {
              Write-Host "  $($_.FullName)"
            }
            
            # Check for MSI files
            $msiFiles = Get-ChildItem -Path $bundleDir -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue
            if ($msiFiles) {
              Write-Host "`n✓ Found $($msiFiles.Count) MSI file(s):"
              $msiFiles | ForEach-Object { Write-Host "  $($_.FullName)" }
            }
            
            # Check for NSIS files
            $nsisFiles = Get-ChildItem -Path $bundleDir -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
            if ($nsisFiles) {
              Write-Host "`n✓ Found $($nsisFiles.Count) NSIS/EXE file(s):"
              $nsisFiles | ForEach-Object { Write-Host "  $($_.FullName)" }
            }
          } else {
            Write-Host "✗ Bundle directory NOT created: $bundleDir"
            Write-Host "Checking release directory structure..."
            if (Test-Path "src-tauri\target\release") {
              Write-Host "Release directory contents:"
              Get-ChildItem -Path "src-tauri\target\release" | ForEach-Object {
                Write-Host "  $($_.Name) - $($_.PSIsContainer ? 'Directory' : 'File')"
              }
            } else {
              Write-Host "✗ Release directory does not exist!"
            }
          }
          
          if ($buildExitCode -ne 0) {
            Write-Host "`n✗ Build failed with exit code $buildExitCode"
            exit $buildExitCode
          }
          
          if (-not (Test-Path $bundleDir)) {
            Write-Host "`n⚠ Warning: Build completed but bundle directory was not created"
            Write-Host "Attempting alternative build method..."
            
            # Try method 1: Direct tauri CLI
            Write-Host "Method 1: Direct tauri CLI with specific target"
            npx tauri build --target x86_64-pc-windows-msvc --bundles msi,nsis 2>&1 | Tee-Object -Variable alt1Output
            $alt1ExitCode = $LASTEXITCODE
            Write-Host "Method 1 exit code: $alt1ExitCode"
            
            if (-not (Test-Path $bundleDir) -and $alt1ExitCode -eq 0) {
              # Try method 2: Tauri build without target specification
              Write-Host "`nMethod 2: Tauri CLI without target specification"
              npx tauri build --bundles msi,nsis 2>&1 | Tee-Object -Variable alt2Output
              $alt2ExitCode = $LASTEXITCODE
              Write-Host "Method 2 exit code: $alt2ExitCode"
            }
            
            if (-not (Test-Path $bundleDir)) {
              # Try method 3: Cargo tauri (if available)
              Write-Host "`nMethod 3: Direct cargo tauri command"
              cd src-tauri
              try {
                cargo tauri build --bundles msi,nsis 2>&1 | Tee-Object -Variable alt3Output
                $alt3ExitCode = $LASTEXITCODE
                Write-Host "Method 3 exit code: $alt3ExitCode"
              } catch {
                Write-Host "Method 3 failed: $_"
              }
              cd ..
            }
            
            Write-Host "`nAlternative build output:"
            $altBuildOutput
            Write-Host "Alternative build exit code: $altExitCode"
            
            # Check again for bundle directory
            if (Test-Path $bundleDir) {
              Write-Host "✓ Bundle directory created by alternative method"
            } else {
              Write-Host "✗ Alternative method also failed to create bundle directory"
            }
          }

      - name: Verify bundle contents and FFmpeg inclusion
        if: steps.build.outcome == 'success'
        run: |
          Write-Host "=== Verifying bundle contents ==="
          
          $bundleDir = "src-tauri\target\release\bundle"
          
          # Check if installers were created
          $msiFiles = Get-ChildItem -Path "$bundleDir\msi" -Filter "*.msi" -ErrorAction SilentlyContinue
          $exeFiles = Get-ChildItem -Path "$bundleDir\nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          
          Write-Host "Build completed successfully with installers:"
          if ($msiFiles) {
            $msiFiles | ForEach-Object { 
              Write-Host "✓ MSI: $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)"
            }
          }
          if ($exeFiles) {
            $exeFiles | ForEach-Object { 
              Write-Host "✓ NSIS: $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)"
            }
          }
          
          # Check if FFmpeg was available during build
          $ffmpegExists = Test-Path "src-tauri\resources\ffmpeg.exe"
          $ffprobeExists = Test-Path "src-tauri\resources\ffprobe.exe"
          
          if ($ffmpegExists -and $ffprobeExists) {
            Write-Host "✓ FFmpeg files are available in resources directory"
            Write-Host "  Note: FFmpeg bundling will be handled in application code"
          } else {
            Write-Host "⚠ FFmpeg files not found in resources directory"
          }
          
          Write-Host "Bundle verification completed successfully"
        env:
          CARGO_TERM_COLOR: always
          TAURI_PRIVATE_KEY: ""
          TAURI_KEY_PASSWORD: ""
          RUST_BACKTRACE: 1
          TAURI_BUNDLE: "true"
        continue-on-error: false

      - name: Debug - List all bundle directories
        run: |
          Write-Host "Checking bundle directory structure..."
          $bundleDir = "src-tauri\target\release\bundle"
          if (Test-Path $bundleDir) {
            Write-Host "Bundle directory exists: $bundleDir"
            Get-ChildItem -Path $bundleDir -Recurse | ForEach-Object {
              Write-Host "  $($_.FullName)"
            }
          } else {
            Write-Host "Bundle directory does not exist: $bundleDir"
          }

      - name: List build artifacts
        run: |
          Write-Host "=== Searching for MSI files ==="
          $msiPath = "src-tauri\target\release\bundle\msi"
          if (Test-Path $msiPath) {
            $msiFiles = Get-ChildItem -Path $msiPath -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue
            if ($msiFiles) {
              Write-Host "Found MSI files:"
              $msiFiles | ForEach-Object { Write-Host "  $($_.FullName)" }
            } else {
              Write-Host "No MSI files found in $msiPath"
            }
          } else {
            Write-Host "MSI directory does not exist: $msiPath"
          }
          
          Write-Host "`n=== Searching for NSIS files ==="
          $nsisPath = "src-tauri\target\release\bundle\nsis"
          if (Test-Path $nsisPath) {
            $exeFiles = Get-ChildItem -Path $nsisPath -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
            if ($exeFiles) {
              Write-Host "Found NSIS files:"
              $exeFiles | ForEach-Object { Write-Host "  $($_.FullName)" }
            } else {
              Write-Host "No NSIS files found in $nsisPath"
            }
          } else {
            Write-Host "NSIS directory does not exist: $nsisPath"
          }
          
          Write-Host "`n=== Searching for any installer files ==="
          $allFiles = Get-ChildItem -Path "src-tauri\target\release\bundle" -Include *.msi,*.exe -Recurse -ErrorAction SilentlyContinue
          if ($allFiles) {
            Write-Host "Found installer files:"
            $allFiles | ForEach-Object { Write-Host "  $($_.FullName)" }
          } else {
            Write-Host "No installer files found anywhere in bundle directory"
          }

      - name: Prepare artifacts for upload
        if: steps.build.outcome == 'success'
        run: |
          Write-Host "Preparing artifacts for upload..."
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null
          
          # Find and copy MSI files
          $msiFiles = Get-ChildItem -Path "src-tauri\target\release\bundle" -Filter "*.msi" -Recurse -ErrorAction SilentlyContinue
          if ($msiFiles) {
            Write-Host "Found $($msiFiles.Count) MSI file(s)"
            New-Item -ItemType Directory -Force -Path "artifacts\msi" | Out-Null
            $msiFiles | ForEach-Object { 
              Write-Host "  Copying: $($_.FullName)"
              Copy-Item $_.FullName -Destination "artifacts\msi\" -Force 
            }
          } else {
            Write-Host "No MSI files found"
          }
          
          # Find and copy NSIS/EXE files
          $exeFiles = Get-ChildItem -Path "src-tauri\target\release\bundle" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
          if ($exeFiles) {
            Write-Host "Found $($exeFiles.Count) EXE file(s)"
            New-Item -ItemType Directory -Force -Path "artifacts\nsis" | Out-Null
            $exeFiles | ForEach-Object { 
              Write-Host "  Copying: $($_.FullName)"
              Copy-Item $_.FullName -Destination "artifacts\nsis\" -Force 
            }
          } else {
            Write-Host "No EXE files found"
          }

      - name: Upload MSI installer
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-msi
          path: artifacts/msi/*.msi
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload NSIS installer
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-nsis
          path: artifacts/nsis/*.exe
          retention-days: 30
          if-no-files-found: ignore

