name: Build Windows Installer

on:
  push:
    branches:
      - main
      - release/**
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Windows installer
        run: npm run tauri:build:windows
        env:
          CARGO_TERM_COLOR: always

      - name: List build artifacts
        run: |
          echo "MSI files:"
          dir /s /b src-tauri\target\release\bundle\msi\*.msi 2>nul || echo "No MSI files found"
          echo "NSIS files:"
          dir /s /b src-tauri\target\release\bundle\nsis\*.exe 2>nul || echo "No NSIS files found"

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-installer-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30
          if-no-files-found: warn

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-installer-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: warn

