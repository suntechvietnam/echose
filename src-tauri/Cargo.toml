[package]
name = "echose"
version = "0.1.0"
description = "echose ứng dụng xây video siêu nhanh"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0", features = ["config-json5"] }

[dependencies]
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-http = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-process = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["stream", "json"] }
dirs = "5.0"
rand = "0.8"
lazy_static = "1.4"
uuid = { version = "1.0", features = ["v4"] }
futures = "0.3"
# Speech-to-text với whisper-rs (bindings cho whisper.cpp)
num_cpus = "1.0"
whisper-rs = "0.15.1"
hound = "3.5"  # Đọc WAV files
anyhow = "1.0"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
custom-protocol = ["tauri/custom-protocol"]

# Bundle configuration to include FFmpeg in installer
[package.metadata.tauri.bundle]
resources = ["resources/**"]



