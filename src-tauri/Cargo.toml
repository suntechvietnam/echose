[package]
name = "ytbflow"
version = "0.1.0"
description = "YTBFlow Desktop App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "notification-all",
    "shell-open",
    "dialog-open",
    "dialog-save",
    "fs-read-file",
    "fs-write-file",
    "fs-read-dir",
    "fs-create-dir",
    "fs-remove-file",
    "fs-remove-dir",
    "fs-rename-file",
    "fs-exists",
    "http-request",
    "notification",
    "path-all",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["stream"] }
dirs = "5.0"
rand = "0.8"
lazy_static = "1.4"
uuid = { version = "1.0", features = ["v4"] }

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
custom-protocol = ["tauri/custom-protocol"]

# Bundle configuration to include FFmpeg in installer
[package.metadata.tauri.bundle]
resources = ["resources/**"]



