<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Gemini Text Splitting</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #0f172a;
            color: white;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            color: #10b981;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            resize: vertical;
            margin-bottom: 15px;
        }

        button {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
        }

        .status.loading {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
        }

        .status.success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .chunks-container {
            margin-top: 30px;
        }

        .chunk {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .chunk-header {
            font-size: 12px;
            color: #10b981;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .chunk-content {
            color: #e2e8f0;
            line-height: 1.6;
        }

        .chunk-stats {
            margin-top: 8px;
            font-size: 11px;
            color: #64748b;
        }

        .summary {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧪 Test Gemini Text Splitting</h1>
        <p class="subtitle">Kiểm tra khả năng chia đoạn văn bản tiếng Nhật của Gemini AI</p>

        <textarea id="inputText" placeholder="Dán văn bản tiếng Nhật vào đây...">石橋社長、私が日本に来て以来、社長には大変お世話になっております。

本日は、以下の3つの件についてお話しさせていただきます。（が（口頭での話が良いかと思いましたが、難しかったので書きました）

１。10月のボーナスについて 
10月初めの会議で石橋さんからボーナスの話がありましたので、10月分のボーナスが受け取れるかどうか確認したいと思います。（私の会社との契約ではボーナスが無いことは理解していますが、今年ベトナムチームの旅行にいませんでした、日本に来てからもボーナスがなかったため、みんな様がそれを受け取る場合、自分だけ受け取れないのは本当に不公平だと感じます。）

２。ビザ申請に関する
11月からビザの延長手続きを行う必要があると思いますが、引き続き日本で生活できるように、書類の準備をする予定です。
現在、契約は契約社員ですが、もし可能であれば、契約社員から正社員（正社員契約）に変更するか、5年契約に変更していただけませんか。
理由は現在の1年ではなく、3年の滞在期間延長を希望しているからです。（正社員または長期契約であれば、3年間の滞在期間延長が可能だと聞いています。）

私は少なくとも2028年までは日本に住んで働きたいと思っています。 （ベトナムに戻るまでに日本語を上手に上達させたいです。

３。給与と雇用契約に関する 
私は2022年9月からBalocco Vietnam、2024年2月からBalocco JPで働いています。Baloccoに入社してから2年が経ち、現在までに5年のプログラミングに関する業務経験があります。毎日、日本語の勉強を続けており、より良い仕事ができるように努力しています。また、Baloccoの発展にも貢献したいと考えています。そのため、今後の契約においては、給与の増額やボーナス、手当などの条件を追加していただけることを希望しています。

また、Balocco JPでの昇給プロセスについて教えていただければ幸いです。（日本に来た時、私は新卒と同じ給与体系で支払われていると聞いており、現在、6ヶ月間の勤務後、1万円の昇給がありました。）</textarea>

        <button onclick="testSplit()" id="btnTest">✂️ Test Chia Đoạn</button>
        <button onclick="clearResults()" id="btnClear">🗑️ Xóa Kết Quả</button>

        <div id="status" style="display:none;"></div>
        <div id="results"></div>
    </div>

    <script>
        const GEMINI_KEY = 'AIzaSyDO6Z5xfjjC9jJOtUn0T06OLxeJ_bIEZ1s';

        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = `status ${type}`;
            statusEl.style.display = 'block';
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('status').style.display = 'none';
        }

        async function testSplit() {
            const text = document.getElementById('inputText').value.trim();
            if (!text) {
                alert('Vui lòng nhập văn bản!');
                return;
            }

            const btnTest = document.getElementById('btnTest');
            btnTest.disabled = true;
            clearResults();
            showStatus('Đang gọi Gemini API...', 'loading');

            try {
                const startTime = Date.now();

                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Bạn là chuyên gia xử lý ngôn ngữ Nhật Bản.
Hãy chia đoạn văn bản tiếng Nhật dưới đây thành một mảng JSON các chuỗi.

Yêu cầu NGHIÊM NGẶT:
1. Mỗi chuỗi dài 100-150 ký tự tiếng Nhật (bao gồm cả Kanji, Hiragana, Katakana).
2. PHẢI ngắt ở vị trí tự nhiên: dấu chấm (。), xuống dòng, hoặc hết một ý.
3. Tuyệt đối KHÔNG thay đổi, dịch, hoặc thêm bớt nội dung gốc.
4. Trả về DUY NHẤT một mảng JSON. Ví dụ: ["đoạn 1", "đoạn 2", "đoạn 3"]
5. KHÔNG viết giải thích, KHÔNG thêm markdown code block.

Văn bản cần chia:
${text}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                const endTime = Date.now();

                console.log('Gemini Response:', data);

                if (data.error) {
                    throw new Error(data.error.message);
                }

                if (!data.candidates || !data.candidates[0]) {
                    throw new Error('Không nhận được kết quả từ Gemini');
                }

                const rawText = data.candidates[0].content.parts[0].text;
                console.log('Raw output:', rawText);

                // Làm sạch kết quả
                let cleanText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                const chunks = JSON.parse(cleanText);

                if (!Array.isArray(chunks) || chunks.length === 0) {
                    throw new Error('Kết quả không phải là mảng hợp lệ');
                }

                // Hiển thị kết quả
                showStatus(`✅ Thành công! Chia thành ${chunks.length} đoạn trong ${endTime - startTime}ms`, 'success');
                displayResults(chunks, text);

            } catch (error) {
                console.error('Error:', error);
                showStatus(`❌ Lỗi: ${error.message}`, 'error');
            } finally {
                btnTest.disabled = false;
            }
        }

        function displayResults(chunks, originalText) {
            const resultsEl = document.getElementById('results');

            // Tổng quan
            const totalChars = originalText.length;
            const avgCharsPerChunk = Math.round(totalChars / chunks.length);

            let html = `
                <div class="summary">
                    <strong>📊 Thống kê:</strong><br>
                    • Tổng ký tự: ${totalChars}<br>
                    • Số đoạn: ${chunks.length}<br>
                    • Trung bình: ${avgCharsPerChunk} ký tự/đoạn<br>
                    • Ước tính thời gian xử lý: ${Math.round(chunks.length * 25)} giây (${chunks.length} đoạn × 25s/đoạn)
                </div>
            `;

            // Hiển thị từng đoạn
            chunks.forEach((chunk, index) => {
                html += `
                    <div class="chunk">
                        <div class="chunk-header">Đoạn ${index + 1} / ${chunks.length}</div>
                        <div class="chunk-content">${chunk}</div>
                        <div class="chunk-stats">Độ dài: ${chunk.length} ký tự</div>
                    </div>
                `;
            });

            resultsEl.innerHTML = html;
        }
    </script>
</body>

</html>
